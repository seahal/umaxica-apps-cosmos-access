<%
  # R5 cell stores are fixed deployment bindings. The connection key is selected by the
  # process configuration before Rails boots; no request, host or token value participates in
  # this lookup. The current local completion scope provisions the twelve JP/WW cells below.
  rp_cells = [
    { connection: "rp_base_app", env_prefix: "RP_BASE_APP", database: "development_rp_base_app_db", client_id: "base-app-ww" },
    { connection: "rp_core_app", env_prefix: "RP_CORE_APP", database: "development_rp_core_app_db", client_id: "core-app-jp" },
    { connection: "rp_warp_app", env_prefix: "RP_WARP_APP", database: "development_rp_warp_app_db", client_id: "warp-app-jp" },
    { connection: "rp_palm_app", env_prefix: "RP_PALM_APP", database: "development_rp_palm_app_db", client_id: "palm-app-jp" },


    { connection: "rp_base_org", env_prefix: "RP_BASE_ORG", database: "development_rp_base_org_db", client_id: "base-org-ww" },
    { connection: "rp_core_org", env_prefix: "RP_CORE_ORG", database: "development_rp_core_org_db", client_id: "core-org-jp" },
    { connection: "rp_warp_org", env_prefix: "RP_WARP_ORG", database: "development_rp_warp_org_db", client_id: "warp-org-jp" },
    { connection: "rp_edit_org", env_prefix: "RP_EDIT_ORG", database: "development_rp_edit_org_db", client_id: "edit-org-ww" },
    { connection: "rp_tech_org", env_prefix: "RP_TECH_ORG", database: "development_rp_tech_org_db", client_id: "tech-org-ww" },
  ].map do |cell|
    cell.merge(
      migrations_path: "db/#{cell.fetch(:connection)}_migrate",
      schema_dump: "#{cell.fetch(:connection)}_structure.sql",
      test_database: cell.fetch(:database).sub("development_", "test_"),
      production_database: "production_#{cell.fetch(:connection)}_db",
    ).freeze
  end.freeze
%>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  port: 5432
  timeout: 30000
  # Session settings are applied only from `variables:`; top-level keys were ignored (D-142).
  variables:
    lock_timeout: 2s
    # Raised from 2s so background jobs (e.g. RetentionPurgeJob batch deletes) are not
    # killed mid-statement. Web requests are additionally bounded by rack-timeout (10s).
    statement_timeout: 15s
  advisory_locks: false
test_default: &test_default
  !!merge <<: *default
  # The committed-transaction concurrency tests retain the test thread's lease
  # while two worker threads use independent connections.
  pool: 3
  # Fixed Dev Container contract (compose.yaml `primary`); test databases are never configured
  # from the environment, so a stray exported variable cannot redirect a destructive preparation.
  host: primary
  username: root
  password: development
  timeout: 20000
  prepared_statements: false
  advisory_locks: true
  variables:
    lock_timeout: 2s
    statement_timeout: 10s
    max_parallel_workers: 0
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    jit: off
development_default: &development_default
  !!merge <<: *default
  pool: 2
  # Fixed Dev Container contract (compose.yaml `primary` and `replica` services, non-secret local
  # login). Development runs only inside the Dev Container (user decision 2026-10-19).
  username: root
  password: development
development:
  op_base_org:
    !!merge <<: *development_default
    database: development_op_base_org_db
    host: primary
    migrations_paths: db/op_base_org_migrate
    schema_dump: op_base_org_structure.sql
  op_base_org_replica:
    !!merge <<: *development_default
    replica: true
    database: development_op_base_org_db
    host: replica
    migrations_paths: db/op_base_org_migrate
  op_base_app:
    !!merge <<: *development_default
    database: development_op_base_app_db
    host: primary
    migrations_paths: db/op_base_app_migrate
  op_base_app_replica:
    !!merge <<: *development_default
    replica: true
    database: development_op_base_app_db
    host: replica
    migrations_paths: db/op_base_app_migrate
<% rp_cells.each do |cell| %>
  <%= cell.fetch(:connection) %>:
    !!merge <<: *development_default
    database: <%= cell.fetch(:database) %>
    host: primary
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
  <%= cell.fetch(:connection) %>_replica:
    !!merge <<: *development_default
    replica: true
    database: <%= cell.fetch(:database) %>
    host: replica
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
<% end %>
  queue:
    !!merge <<: *development_default
    pool: 5
    database: development_queue_db
    host: primary
    migrations_paths: db/queues_migrate
  occurrence:
    !!merge <<: *development_default
    database: development_occurrence_db
    host: primary
    migrations_paths: db/occurrences_migrate
  occurrence_replica:
    !!merge <<: *development_default
    replica: true
    database: development_occurrence_db
    host: replica
    migrations_paths: db/occurrences_migrate
  chronicle:
    !!merge <<: *development_default
    database: development_chronicle_db
    host: primary
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  chronicle_replica:
    !!merge <<: *development_default
    replica: true
    database: development_chronicle_db
    host: replica
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  # Rails default database. Durable, low-frequency, application-wide configuration
  # (currently Flipper). Deliberately has no replica: a flag is read immediately
  # after it is toggled, and replication lag would surface as a flip that "did not apply".
  primary:
    !!merge <<: *development_default
    database: development_primary_db
    host: primary
    migrations_paths: db/migrate
# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  op_base_org:
    !!merge <<: *test_default
    database: test_op_base_org_db
    migrations_paths: db/op_base_org_migrate
    schema_dump: op_base_org_structure.sql
  op_base_org_replica:
    !!merge <<: *test_default
    replica: true
    database: test_op_base_org_replica_db
    migrations_paths: db/op_base_org_migrate
    schema_dump: op_base_org_structure.sql
  op_base_app:
    !!merge <<: *test_default
    database: test_op_base_app_db
    migrations_paths: db/op_base_app_migrate
  op_base_app_replica:
    !!merge <<: *test_default
    replica: true
    database: test_op_base_app_replica_db
    migrations_paths: db/op_base_app_migrate
    schema_dump: op_base_app_structure.sql
<% rp_cells.each do |cell| %>
  <%= cell.fetch(:connection) %>:
    !!merge <<: *test_default
    database: <%= cell.fetch(:test_database) %>
    migrations_paths: <%= cell.fetch(:migrations_path) %>
  <%= cell.fetch(:connection) %>_replica:
    !!merge <<: *test_default
    replica: true
    database: <%= cell.fetch(:test_database).sub("_db", "_replica_db") %>
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
<% end %>
  queue:
    !!merge <<: *test_default
    # A manually started isolated Solid Queue worker needs one execution
    # connection plus its polling and heartbeat connections.
    pool: 5
    database: test_queue_db
    migrations_paths: db/queues_migrate
  occurrence:
    !!merge <<: *test_default
    database: test_occurrence_db
    migrations_paths: db/occurrences_migrate
  occurrence_replica:
    !!merge <<: *test_default
    replica: true
    database: test_occurrence_replica_db
    migrations_paths: db/occurrences_migrate
    schema_dump: occurrence_structure.sql
  chronicle:
    !!merge <<: *test_default
    database: test_chronicle_db
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  chronicle_replica:
    !!merge <<: *test_default
    replica: true
    database: test_chronicle_replica_db
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  primary:
    !!merge <<: *test_default
    database: test_primary_db
    migrations_paths: db/migrate
production: {}
