# Authoritative frontend ownership. A Rails application layout is Importmap/Propshaft;
# an Inertia layout or a documented Vite-only content page is Vite Rails.
version: 1
stacks:
  importmap:
    - auth/app/application
    - auth/org/application
    - visa/app/application
    - visa/org/application
  vite:
    - auth/app/inertia
    - auth/org/inertia
    - visa/app/inertia
    - visa/org/inertia
  excluded:
    - email/application
rules:
  importmap: [erb, turbo, stimulus, propshaft]
  vite: [vite, typescript, react, inertia]
