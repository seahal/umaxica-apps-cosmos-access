# Config used by `ArchitectureBaseline.measure`: the two architecture cops only. No exclusions are
# loaded, so the complete repository is measured.
inherit_from:
  - umaxica.yml

AllCops:
  TargetRubyVersion: 4.0
  DisabledByDefault: true
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "log/**/*"
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
