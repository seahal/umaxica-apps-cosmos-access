openapi: 3.0.4
info:
  title: Umaxica Auth JSON API (app)
  version: '0'
  contact:
    name: API Support
  description: |
    Machine-facing JSON endpoints served under /api/v0 on Auth app. Auth app and org are independent
    trust boundaries served on separate hosts, so each has its own description.

    OAuth 2.0, OIDC, WebAuthn, DBSC, and .well-known endpoints are intentionally absent. Their
    protocol contracts are documented separately.

    The preference endpoints are Auth app's same-origin browser preference API. The text operational
    endpoints are absent because they render text/plain; only the JSON health and revision routes are
    described here. Health and revision have no server because they are blocked at the edge.
tags:
  - name: Health
    description: Machine-readable health aggregate and deployment revision.
  - name: Preferences
    description: Cookie-consent and color-theme JSON endpoints.
paths:
  /api/v0/health.json:
    get:
      summary: Machine-readable health aggregate
      description: 'Internal probe for orchestrators and monitoring, not a user-facing availability contract. Aggregates the startup, liveness, and readiness verdicts into the `pass` / `warn` / `fail` vocabulary. A readiness outage never changes the liveness verdict: liveness is dependency-free. `fail` is served as HTTP 503; `pass` and `warn` as HTTP 200. The body identifies the controller namespace selected by routing and carries no dependency name, exception, path, or environment value.'
      security: []
      operationId: getApiV0Health
      tags:
        - Health
      responses:
        '200':
          description: The instance is serving. `status` is `pass` or `warn`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '406':
          description: The request `Accept` excludes `application/json`. The refusal has an empty body.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '503':
          description: The instance is not serving. `status` is `fail`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /api/v0/revision.json:
    get:
      summary: Machine-readable deployment revision
      description: Returns the deployment revision identifier, or `null` when the deployment has none, together with the RFC 3339 UTC render timestamp. Internal endpoint; no authentication, no database access.
      security: []
      operationId: getApiV0Revision
      tags:
        - Health
      responses:
        '200':
          description: The current deployment revision, or `null`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '406':
          description: The request `Accept` excludes `application/json`. The refusal has an empty body.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
  /api/v0/preferences/cookie:
    servers:
      - url: https://auth.umaxica.app
        description: Auth app host.
    get:
      summary: Cookie-consent banner state
      description: 'Reports whether the cookie-consent banner should be shown. Open: no session is required. Served host-locally by each listed host: each host reads and writes its own host-only preference credentials, and a browser calls only its current origin.'
      operationId: getPreferencesCookie
      tags:
        - Preferences
      security: []
      responses:
        '200':
          description: Banner visibility for this caller.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieBanner'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Record cookie consent
      description: 'Records a cookie-consent decision. Open: a caller without a preference token records the decision in the consent buffer only. `cookie.consented` is required; each present flag must be a boolean or one of `1`, `0`, `"1"`, `"0"`, `"true"`, `"false"`, `"t"`, `"f"` (and the upper-case forms), otherwise the request is a 422 naming each field. Successful writes have no representation.'
      operationId: patchPreferencesCookie
      tags:
        - Preferences
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cookie
              properties:
                cookie:
                  type: object
                  required:
                    - consented
                  properties:
                    consented: {}
                    functional: {}
                    performant: {}
                    targetable: {}
      responses:
        '204':
          description: Consent recorded. No body (RFC 9110 15.3.5).
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ForeignPreferenceToken'
        '403':
          $ref: '#/components/responses/CsrfVerificationFailed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v0/preferences/theme:
    servers:
      - url: https://auth.umaxica.app
        description: Auth app host.
    get:
      summary: Current color theme
      description: 'Reports the caller''s color theme. No session is required. Served host-locally by each listed host: each host reads and writes its own host-only preference credentials, and a browser calls only its current origin.'
      operationId: getPreferencesTheme
      tags:
        - Preferences
      security: []
      responses:
        '200':
          description: Current theme code.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorTheme'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      summary: Update color theme
      description: Writes the color theme cookie (and the preference record when a preference token is present). `theme` is `light`, `dark`, or `system` (case-insensitive) or a stored code; any other value, including a missing member, is a 422 with the pointer `/theme`. Unknown members are ignored.
      operationId: patchPreferencesTheme
      tags:
        - Preferences
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - theme
              properties:
                theme:
                  type: string
                  enum:
                    - light
                    - dark
                    - system
                    - li
                    - dr
                    - sy
      responses:
        '200':
          description: Theme after the write.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorTheme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ForeignPreferenceToken'
        '403':
          $ref: '#/components/responses/CsrfVerificationFailed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  schemas:
    CheckStatus:
      type: object
      description: One check's verdict in the machine-readable health aggregate.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pass
            - warn
            - fail
    HealthReport:
      type: object
      description: Machine-readable health aggregate for `GET /api/v0/health.json`. See docs/reference/health-endpoints.md. Identifies the controller namespace selected by routing and carries the enum-bounded strings `status` and `checks.*.status`; no dependency name, exception, path, or environment value crosses this boundary.
      required:
        - status
        - checks
        - namespace
        - timestamp
      properties:
        status:
          type: string
          description: Worst of the three checks. `fail` is served with HTTP 503; `pass` and `warn` with 200.
          enum:
            - pass
            - warn
            - fail
        checks:
          type: object
          description: Per-check verdicts, mapped independently so a readiness failure never changes the dependency-free liveness verdict.
          required:
            - startup
            - liveness
            - readiness
          properties:
            startup:
              $ref: '#/components/schemas/CheckStatus'
            liveness:
              $ref: '#/components/schemas/CheckStatus'
            readiness:
              $ref: '#/components/schemas/CheckStatus'
        namespace:
          type: string
          pattern: ^[a-z]+/[a-z]+$
          description: The `<frame>/<brand>` controller namespace that handled the request.
        timestamp:
          type: string
          format: date-time
          description: UTC time when Rails rendered the health response, formatted as RFC 3339 with `Z`.
    Revision:
      type: object
      description: Machine-readable deployment revision for `GET /api/v0/revision.json`.
      required:
        - revision
        - timestamp
      properties:
        revision:
          type: string
          nullable: true
          description: The framework-resolved deployment revision (`Rails.application.revision`). Always present as a member; the value is `null` when no revision is configured, which is a normal state. Never a fabricated identifier.
        timestamp:
          type: string
          format: date-time
          description: UTC time when Rails rendered the revision response, formatted as RFC 3339 with `Z`.
    CookieBanner:
      type: object
      required:
        - show_banner
      properties:
        show_banner:
          type: boolean
          description: True when the caller has not recorded cookie consent.
    Problem:
      type: object
      description: RFC 9457 Problem Details. This repository defines exactly two extension members, `request_id` and `errors`; see docs/reference/api-design-standards.md.
      required:
        - type
        - title
        - status
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem identifier. Branch on this value, never on title or detail. Clients must not dereference it (RFC 9457 3.1.1). The registry is closed and enforced in code by `ProblemType`, which raises on an unregistered slug.
          enum:
            - urn:umaxica:problem:bad-request
            - urn:umaxica:problem:authentication-required
            - urn:umaxica:problem:token-expired
            - urn:umaxica:problem:authorization-denied
            - urn:umaxica:problem:csrf-verification-failed
            - urn:umaxica:problem:not-found
            - urn:umaxica:problem:method-not-allowed
            - urn:umaxica:problem:not-acceptable
            - urn:umaxica:problem:unsupported-media-type
            - urn:umaxica:problem:validation-failed
            - urn:umaxica:problem:rate-limited
            - urn:umaxica:problem:server-error
            - urn:umaxica:problem:service-unavailable
        title:
          type: string
          description: Stable summary of the type. Not for programmatic use.
        status:
          type: integer
          description: Duplicates the HTTP status code and always agrees with it.
        detail:
          type: string
          description: Occurrence-specific explanation for a human. Absent when there is none.
        instance:
          type: string
          description: Path identifying this occurrence.
        request_id:
          type: string
          description: Request correlation identifier. Always present.
        errors:
          type: array
          description: Field-level validation problems. Present only on 422.
          items:
            type: object
            required:
              - pointer
              - type
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer into the request body.
              type:
                type: string
                format: uri
              detail:
                type: string
    ColorTheme:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
          description: Stored color-theme code (`li`/`dr`/`sy`) or the canonical option (`light`/`dark`/`system`).
  responses:
    NotAcceptable:
      description: The request `Accept` excludes both `application/json` and `application/problem+json`. The refusal is still sent as a problem document (RFC 9110 15.5.7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: A rate limit was exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. This is the authoritative retry signal; the RateLimit header is informational and may be absent, and no client behaviour may depend on it.
          schema:
            type: integer
        RateLimit:
          schema:
            type: string
            example: '"default";r=0;t=60'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body is not well-formed JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForeignPreferenceToken:
      description: The request presented a preference access token minted for another host or audience. A request that presents no preference token is not refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfVerificationFailed:
      description: The unsafe request did not pass this host's forgery protection.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request carries a body whose `Content-Type` is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The body is well-formed JSON but a field is missing or not an accepted value. `errors` names each field with an RFC 6901 JSON Pointer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
