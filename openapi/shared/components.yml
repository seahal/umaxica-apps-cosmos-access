---
responses:
  Problem:
    description: An RFC 9457 problem document.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  NotAcceptable:
    description:
      The request `Accept` excludes both `application/json` and `application/problem+json`. The
      refusal is still sent as a problem document (RFC 9110 15.5.7).
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  UnsupportedMediaType:
    description: The request carries a body whose `Content-Type` is not `application/json`.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  BadRequest:
    description: The request body is not well-formed JSON.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  ForeignPreferenceToken:
    description:
      The request presented a preference access token minted for another host or audience. A request
      that presents no preference token is not refused.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  CsrfVerificationFailed:
    description: The unsafe request did not pass this host's forgery protection.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  ValidationFailed:
    description:
      The body is well-formed JSON but a field is missing or not an accepted value. `errors` names
      each field with an RFC 6901 JSON Pointer.
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
  RateLimited:
    description: A rate limit was exceeded.
    headers:
      Retry-After:
        description:
          Seconds to wait before retrying. This is the authoritative retry signal; the RateLimit
          header is informational and may be absent, and no client behaviour may depend on it.
        schema:
          type: integer
      RateLimit:
        schema:
          type: string
          example: '"default";r=0;t=60'
    content:
      application/problem+json:
        schema:
          "$ref": "#/schemas/Problem"
schemas:
  Problem:
    type: object
    description:
      RFC 9457 Problem Details. This repository defines exactly two extension members, `request_id`
      and `errors`; see docs/reference/api-design-standards.md.
    required:
      - type
      - title
      - status
      - request_id
    properties:
      type:
        type: string
        format: uri
        description:
          Stable problem identifier. Branch on this value, never on title or detail. Clients must
          not dereference it (RFC 9457 3.1.1). The registry is closed and enforced in code by
          `ProblemType`, which raises on an unregistered slug.
        enum:
          - urn:umaxica:problem:bad-request
          - urn:umaxica:problem:authentication-required
          - urn:umaxica:problem:token-expired
          - urn:umaxica:problem:authorization-denied
          - urn:umaxica:problem:csrf-verification-failed
          - urn:umaxica:problem:not-found
          - urn:umaxica:problem:method-not-allowed
          - urn:umaxica:problem:not-acceptable
          - urn:umaxica:problem:unsupported-media-type
          - urn:umaxica:problem:validation-failed
          - urn:umaxica:problem:rate-limited
          - urn:umaxica:problem:server-error
          - urn:umaxica:problem:service-unavailable
      title:
        type: string
        description: Stable summary of the type. Not for programmatic use.
      status:
        type: integer
        description: Duplicates the HTTP status code and always agrees with it.
      detail:
        type: string
        description: Occurrence-specific explanation for a human. Absent when there is none.
      instance:
        type: string
        description: Path identifying this occurrence.
      request_id:
        type: string
        description: Request correlation identifier. Always present.
      errors:
        type: array
        description: Field-level validation problems. Present only on 422.
        items:
          type: object
          required:
            - pointer
            - type
          properties:
            pointer:
              type: string
              description: RFC 6901 JSON Pointer into the request body.
            type:
              type: string
              format: uri
            detail:
              type: string
  CookieBanner:
    type: object
    required:
      - show_banner
    properties:
      show_banner:
        type: boolean
        description: True when the caller has not recorded cookie consent.
  ColorTheme:
    type: object
    required:
      - theme
    properties:
      theme:
        type: string
        description:
          Stored color-theme code (`li`/`dr`/`sy`) or the canonical option
          (`light`/`dark`/`system`).
  CheckStatus:
    type: object
    description: One check's verdict in the machine-readable health aggregate.
    required:
      - status
    properties:
      status:
        type: string
        enum:
          - pass
          - warn
          - fail
  HealthReport:
    type: object
    description:
      Machine-readable health aggregate for `GET /api/v0/health.json`. See
      docs/reference/health-endpoints.md. Identifies the controller namespace selected by routing
      and carries the enum-bounded strings `status` and `checks.*.status`; no dependency name,
      exception, path, or environment value crosses this boundary.
    required:
      - status
      - checks
      - namespace
      - timestamp
    properties:
      status:
        type: string
        description:
          Worst of the three checks. `fail` is served with HTTP 503; `pass` and `warn` with 200.
        enum:
          - pass
          - warn
          - fail
      checks:
        type: object
        description:
          Per-check verdicts, mapped independently so a readiness failure never changes the
          dependency-free liveness verdict.
        required:
          - startup
          - liveness
          - readiness
        properties:
          startup:
            "$ref": "#/schemas/CheckStatus"
          liveness:
            "$ref": "#/schemas/CheckStatus"
          readiness:
            "$ref": "#/schemas/CheckStatus"
      namespace:
        type: string
        pattern: "^[a-z]+/[a-z]+$"
        description: The `<frame>/<brand>` controller namespace that handled the request.
      timestamp:
        type: string
        format: date-time
        description:
          UTC time when Rails rendered the health response, formatted as RFC 3339 with `Z`.
  Revision:
    type: object
    description: Machine-readable deployment revision for `GET /api/v0/revision.json`.
    required:
      - revision
      - timestamp
    properties:
      revision:
        type: string
        nullable: true
        description:
          The framework-resolved deployment revision (`Rails.application.revision`). Always present
          as a member; the value is `null` when no revision is configured, which is a normal state.
          Never a fabricated identifier.
      timestamp:
        type: string
        format: date-time
        description:
          UTC time when Rails rendered the revision response, formatted as RFC 3339 with `Z`.
